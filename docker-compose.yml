version: '3.8'
services:
  mongo:
    image: mongo:7
    container_name: taxi-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: taxi-logs
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: taxi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-guest}
    ports:
      - '5672:5672'
      - '15672:15672'
    restart: unless-stopped

volumes:
  mongo_data:
